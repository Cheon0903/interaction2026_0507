<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shard {
            position: absolute;
            border: 2px solid white;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>

    <script>
        let rotation = 0;
        let count = 0;
        const symmetry = 6;

        document.addEventListener('mousemove', function(e) {
            count++;
            if (count % 2 !== 0) return;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);

            for (let i = 0; i < symmetry; i++) {
                const shard = document.createElement('div');
                shard.className = 'shard';

                let size = 30 + (distance / 4);
                shard.style.width = size + "px";
                shard.style.height = size + "px";

                let hue = (angle * 180 / Math.PI + (i * (360 / symmetry))) % 360;
                let color = "hsl(" + hue + ", 90%, 65%)";
                shard.style.borderColor = color;
                shard.style.boxShadow = "0 0 25px " + color;

                const currentAngle = angle + (i * (Math.PI * 2 / symmetry));
                const posX = centerX + Math.cos(currentAngle) * distance;
                const posY = centerY + Math.sin(currentAngle) * distance;

                shard.style.left = (posX - size / 2) + "px";
                shard.style.top = (posY - size / 2) + "px";
                
                shard.innerText = (i + 1).toString(16).toUpperCase();
                shard.style.color = color;
                shard.style.fontSize = "12px";
                shard.style.fontFamily = "monospace";
                shard.style.display = "flex";
                shard.style.alignItems = "center";
                shard.style.justifyContent = "center";

                document.body.appendChild(shard);

                const shards = document.querySelectorAll('.shard');
                if (shards.length > 54) {
                    shards[0].remove();
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            rotation += 2.5;

            const elements = document.querySelectorAll('.shard');
            elements.forEach(function(el, index) {
                let pulse = 1 + Math.sin(rotation * 0.06 + index) * 0.25;
                el.style.transform = "rotate(" + (rotation + index * 12) + "deg) scale(" + pulse + ")";
            });
        }

        animate();
    </script>
</body>
</html>
